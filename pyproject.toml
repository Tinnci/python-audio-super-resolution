[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "audio-super-resolution"
version = "0.1.0"
description = "Easy to use audio super-resolution and bandwidth extension from CLI or as a Python package."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "SiTinc" }]
keywords = ["audio", "super-resolution", "bandwidth-extension", "audiosr", "speech", "music"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "tqdm>=4.66",
]

[project.urls]
Homepage = "https://github.com/Tinnci/python-audio-super-resolution"
Repository = "https://github.com/Tinnci/python-audio-super-resolution"
Documentation = "https://github.com/Tinnci/python-audio-super-resolution/blob/main/README.md"
Issues = "https://github.com/Tinnci/python-audio-super-resolution/issues"

[project.scripts]
audio-super-res = "audio_super_resolution.cli:main"
audiosr = "audio_super_resolution.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/audio_super_resolution"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]

[tool.pixi.dependencies]
python = ">=3.10"
pip = ">=24"
numpy = ">=1.26"
scipy = ">=1.11"
pysoundfile = ">=0.12"
tqdm = ">=4.66"
hatchling = ">=1.25"

[tool.pixi.pypi-dependencies]
audio-super-resolution = { path = ".", editable = true }

[tool.pixi.feature.dev.dependencies]
pytest = ">=8"
pytest-cov = ">=5"
ruff = ">=0.6"

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }

[tool.pixi.tasks]
test = "pytest"
lint = "ruff check src tests"
format = "ruff format src tests"
build = "hatchling build"
audio-super-res = "audio-super-res"
audiosr = "audiosr"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
