name: Feature request
description: Suggest an enhancement or new backend
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Describe the workflow or limitation this feature should address.
      placeholder: I want to...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior, API, or CLI you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Note any workaround or alternative backend you considered.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI
        - Python API
        - backend
        - packaging
        - documentation
        - testing
        - other
