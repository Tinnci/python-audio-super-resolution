name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: prefix-dev/setup-pixi@v0.8.10
        with:
          pixi-version: v0.63.2
      - run: pixi run lint
      - run: pixi run test
