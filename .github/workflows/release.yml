name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi

    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.70.2
      - run: pixi run lint
      - run: pixi run format-check
      - run: pixi run typecheck
      - run: pixi run test
      - run: pixi run build
      - run: pixi run metadata-check
      - run: pixi run wheel-check
      - uses: pypa/gh-action-pypi-publish@release/v1
